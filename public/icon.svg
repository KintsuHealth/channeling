<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B4423"/>
      <stop offset="100%" style="stop-color:#5C2D0E"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Coffee stream/channel - three flowing lines -->
  <g fill="none" stroke="#F5F0EB" stroke-width="28" stroke-linecap="round">
    <!-- Left stream -->
    <path d="M156 140 Q156 256 180 320 Q204 384 180 440" opacity="0.7"/>
    <!-- Center stream -->
    <path d="M256 100 Q256 220 256 300 Q256 380 256 440"/>
    <!-- Right stream -->
    <path d="M356 140 Q356 256 332 320 Q308 384 332 440" opacity="0.7"/>
  </g>
  <!-- Coffee drop at bottom -->
  <ellipse cx="256" cy="456" rx="120" ry="24" fill="#F5F0EB" opacity="0.3"/>
</svg>
