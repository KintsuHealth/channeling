<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C4F2E"/>
      <stop offset="100%" style="stop-color:#462C17"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- Coffee stream/channel - three flowing lines -->
  <g fill="none" stroke="#F7F5F1" stroke-width="24" stroke-linecap="round">
    <!-- Left stream -->
    <path d="M164 148 Q164 256 186 316 Q208 376 186 432" opacity="0.55"/>
    <!-- Center stream -->
    <path d="M256 112 Q256 220 256 300 Q256 376 256 432"/>
    <!-- Right stream -->
    <path d="M348 148 Q348 256 326 316 Q304 376 326 432" opacity="0.55"/>
  </g>
  <!-- Coffee pool at bottom -->
  <ellipse cx="256" cy="452" rx="112" ry="20" fill="#F7F5F1" opacity="0.25"/>
</svg>
